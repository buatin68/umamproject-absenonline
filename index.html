    function tandaiHadirSemua() {
        const kelasYangDipilih = (currentUser.role === 'admin') ? document.getElementById('kelasFilter').value : currentUser.kelas;
        const daftarNamaSiswa = daftarSiswaPerKelas[kelasYangDipilih] || [];
        daftarNamaSiswa.forEach(nama => {
            const safeId = nama.replace(/[^a-zA-Z0-9]/g, '');
            const hadirRadio = document.getElementById(`hadir-${safeId}`);
            if (hadirRadio) hadirRadio.checked = true;
        });
    }

    function simpanAbsensi(event) {
        event.preventDefault();
        const tanggalPilihan = document.getElementById('attendanceDate').value;
        const kelasYangDipilih = (currentUser.role === 'admin') ? document.getElementById('kelasFilter').value : currentUser.kelas;
        const daftarNamaSiswa = daftarSiswaPerKelas[kelasYangDipilih] || [];

        daftarNamaSiswa.forEach(nama => {
            const safeId = nama.replace(/[^a-zA-Z0-9]/g, '');
            const statusInput = document.querySelector(`input[name="status-${safeId}"]:checked`);
            if (!statusInput) return;
            
            const status = statusInput.value;
            const keterangan = document.getElementById(`keterangan-${safeId}`).value;
            const existingIndex = absensiData.findIndex(d => d.nama === nama && d.tanggal === tanggalPilihan);

            if (existingIndex > -1) {
                absensiData[existingIndex].status = status;
                absensiData[existingIndex].keterangan = keterangan;
            } else {
                absensiData.push({ tanggal: tanggalPilihan, nama, kelas: kelasYangDipilih, status, keterangan });
            }
        });

        alert(`Absensi untuk kelas ${kelasYangDipilih} pada tanggal ${tanggalPilihan} berhasil disimpan!`);
        showLaporanHarian(tanggalPilihan);
    }

    function generateRekapTable() {
        const container = document.getElementById('rekapTableContainer');
        const periode = document.getElementById('periodeFilter').value;
        const kelasYangDipilih = (currentUser.role === 'admin') ? document.getElementById('kelasFilter').value : currentUser.kelas;
        
        const now = new Date();
        let startDate, endDate;
        let totalHariAktifPeriode = 0;
        let rekapTitleText = `Rekap Absensi - Kelas ${kelasYangDipilih}`;

        if (periode === 'bulan') {
            startDate = new Date(now.getFullYear(), now.getMonth(), 1);
            endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            const namaBulan = now.toLocaleString('id-ID', { month: 'long' });
            rekapTitleText = `Rekap Absensi Bulan ${namaBulan} - Kelas ${kelasYangDipilih}`;
            
            for (let d = new Date(startDate); d <= now && d <= endDate; d.setDate(d.getDate() + 1)) {
                const dayOfWeek = d.getDay();
                if (dayOfWeek > 0 && dayOfWeek < 6) {
                    totalHariAktifPeriode++;
                }
            }
        } else {
            if (periode === 'semester1') {
                const year = (now.getMonth() < 6) ? now.getFullYear() - 1 : now.getFullYear();
                startDate = new Date(year, 6, 1); // Juli
                endDate = new Date(year, 11, 31); // Desember
                rekapTitleText = `Rekap Absensi Semester 1 - Kelas ${kelasYangDipilih}`;
            } else if (periode === 'semester2') {
                const year = (now.getMonth() < 6) ? now.getFullYear() : now.getFullYear() - 1;
                const startYear = (now.getMonth() < 6) ? year : year + 1;
                startDate = new Date(startYear, 0, 1); // Januari
                endDate = new Date(startYear, 5, 30); // Juni
                rekapTitleText = `Rekap Absensi Semester 2 - Kelas ${kelasYangDipilih}`;
            }
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const dayOfWeek = d.getDay();
                if (dayOfWeek > 0 && dayOfWeek < 6) {
                    totalHariAktifPeriode++;
                }
            }
        }

        const dataPeriode = absensiData.filter(d => {
            const tanggalAbsen = new Date(d.tanggal + 'T00:00:00');
            return d.kelas === kelasYangDipilih && tanggalAbsen >= startDate && tanggalAbsen <= endDate;
        });
        
        const rekap = {};
        const daftarNamaSiswa = daftarSiswaPerKelas[kelasYangDipilih] || [];
        daftarNamaSiswa.forEach(nama => {
            rekap[nama] = { Hadir: 0, Sakit: 0, Izin: 0, Alpha: 0 };
        });

        dataPeriode.forEach(d => {
            if (rekap[d.nama] && rekap[d.nama][d.status] !== undefined) {
                rekap[d.nama][d.status]++;
            }
        });

        let tableHTML = `
             <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">${rekapTitleText}</h2>
                <button onclick="exportPdf('${rekapTitleText}', 'tabelLaporan')" class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium">Export PDF</button>
            </div>`;
        
        if (totalHariAktifPeriode > 0) {
            tableHTML += `<p class="mb-4 text-gray-700 font-medium">Total Hari Aktif Belajar: <span class="font-bold text-indigo-600">${totalHariAktifPeriode} hari</span></p>`;
        }

        tableHTML += `
            <div class="overflow-x-auto">
                <table id="tabelLaporan" class="w-full text-left border-collapse">
                    <thead>
                        <tr>
                            <th class="p-3 font-semibold uppercase bg-gray-100 border-b">No.</th>
                            <th class="p-3 font-semibold uppercase bg-gray-100 border-b">Nama Siswa</th>
                            <th class="p-3 font-semibold uppercase bg-gray-100 border-b text-center">Hadir</th>
                            <th class="p-3 font-semibold uppercase bg-gray-100 border-b text-center">Sakit</th>
                            <th class="p-3 font-semibold uppercase bg-gray-100 border-b text-center">Izin</th>
                            <th class="p-3 font-semibold uppercase bg-gray-100 border-b text-center">Alpha</th>
                            <th class="p-3 font-semibold uppercase bg-gray-100 border-b text-center">Persentase</th>
                        </tr>
                    </thead>
                    <tbody>`;
        
        const sortedNama = Object.keys(rekap).sort();
        if (sortedNama.length > 0) {
            sortedNama.forEach((namaSiswa, index) => {
                const totalHadir = rekap[namaSiswa].Hadir;
                const persentase = totalHariAktifPeriode > 0 ? ((totalHadir / totalHariAktifPeriode) * 100).toFixed(1) + '%' : '0.0%';
                tableHTML += `<tr class="hover:bg-gray-50">
                    <td class="p-3 border-b">${index + 1}</td>
                    <td class="p-3 border-b">${namaSiswa}</td>
                    <td class="p-3 border-b text-center">${totalHadir}</td>
                    <td class="p-3 border-b text-center">${rekap[namaSiswa].Sakit}</td>
                    <td class="p-3 border-b text-center">${rekap[namaSiswa].Izin}</td>
                    <td class="p-3 border-b text-center">${rekap[namaSiswa].Alpha}</td>
                    <td class="p-3 border-b text-center font-bold">${persentase}</td>
                </tr>`;
            });
        } else {
             tableHTML += `<tr><td colspan="7" class="text-center p-6 text-gray-500">Tidak ada data absensi untuk periode ini.</td></tr>`;
        }

        tableHTML += `</tbody></table></div>`;
        container.innerHTML = tableHTML;
    }

    function generateGrafik() {
        const now = new Date();
        const periode = document.getElementById('grafikPeriodeFilter').value;
        let startDate, endDate;
        let title = `Grafik Kehadiran`;
        let chartLabels, chartDatasets;
        let yAxisMax = undefined;

        if (myChart) myChart.destroy();
        const ctx = document.getElementById('attendanceChart').getContext('2d');

        let dataUntukGrafik;
        const kelasDipilihAdmin = document.getElementById('grafikKelasFilter')?.value;
        
        if (currentUser.role === 'admin') {
            dataUntukGrafik = (kelasDipilihAdmin === 'semua') ? absensiData : absensiData.filter(d => d.kelas === kelasDipilihAdmin);
            title += (kelasDipilihAdmin === 'semua') ? ' - Semua Kelas' : ` - Kelas ${kelasDipilihAdmin}`;
        } else {
            dataUntukGrafik = absensiData.filter(d => d.kelas === currentUser.kelas);
            title += ` - Kelas ${currentUser.kelas}`;
        }

        if (periode === 'bulan') {
            startDate = new Date(now.getFullYear(), now.getMonth(), 1);
            endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            title += ` Bulan ${now.toLocaleString('id-ID', { month: 'long' })}`;

            const dataBulanIni = dataUntukGrafik.filter(d => {
                const tanggalAbsen = new Date(d.tanggal + 'T00:00:00');
                return tanggalAbsen >= startDate && tanggalAbsen <= endDate;
            });

            const rekapStatus = { Hadir: 0, Sakit: 0, Izin: 0, Alpha: 0 };
            dataBulanIni.forEach(d => {
                if (rekapStatus[d.status] !== undefined) rekapStatus[d.status]++;
            });
            
            chartLabels = ['Hadir', 'Sakit', 'Izin', 'Alpha'];
            chartDatasets = [{
                label: 'Jumlah',
                data: Object.values(rekapStatus),
                backgroundColor: ['#2ECC71', '#F1C40F', '#3498DB', '#E74C3C'],
            }];

        } else { // Semester 1 or 2
            const semesterMonths = (periode === 'semester1') 
                ? { 6: 'Juli', 7: 'Agustus', 8: 'September', 9: 'Oktober', 10: 'November', 11: 'Desember' }
                : { 0: 'Januari', 1: 'Februari', 2: 'Maret', 3: 'April', 4: 'Mei', 5: 'Juni' };
            
            chartLabels = Object.values(semesterMonths);
            title += (periode === 'semester1') ? ' Semester 1' : ' Semester 2';

            const year = (periode === 'semester1' && now.getMonth() < 6) ? now.getFullYear() - 1 : now.getFullYear();
            const startYear = (periode === 'semester2' && now.getMonth() >= 6) ? now.getFullYear() + 1 : now.getFullYear();
            
            startDate = (periode === 'semester1') ? new Date(year, 6, 1) : new Date(startYear, 0, 1);
            endDate = (periode === 'semester1') ? new Date(year, 11, 31) : new Date(startYear, 5, 30);
            
            const dataPeriode = dataUntukGrafik.filter(d => {
                const tanggalAbsen = new Date(d.tanggal + 'T00:00:00');
                return tanggalAbsen >= startDate && tanggalAbsen <= endDate;
            });

            const rekapPerBulan = {};
            let maxHariAktifBulanan = 0;
            Object.entries(semesterMonths).forEach(([monthIndex, namaBulan]) => {
                rekapPerBulan[namaBulan] = { Hadir: 0, Sakit: 0, Izin: 0, Alpha: 0 };
                let hariAktifBulanIni = 0;
                const startOfMonth = (periode === 'semester1') ? new Date(year, monthIndex, 1) : new Date(startYear, monthIndex, 1);
                const endOfMonth = (periode === 'semester1') ? new Date(year, parseInt(monthIndex) + 1, 0) : new Date(startYear, parseInt(monthIndex) + 1, 0);
                for (let d = new Date(startOfMonth); d <= endOfMonth; d.setDate(d.getDate() + 1)) {
                    if (d.getDay() > 0 && d.getDay() < 6) hariAktifBulanIni++;
                }
                if (hariAktifBulanIni > maxHariAktifBulanan) maxHariAktifBulanan = hariAktifBulanIni;
            });

            dataPeriode.forEach(d => {
                const bulan = new Date(d.tanggal + 'T00:00:00').getMonth();
                const namaBulan = semesterMonths[bulan];
                if (namaBulan && rekapPerBulan[namaBulan][d.status] !== undefined) {
                    rekapPerBulan[namaBulan][d.status]++;
                }
            });

            const jumlahSiswa = (kelasDipilihAdmin === 'semua')
                ? Object.values(daftarSiswaPerKelas).reduce((sum, arr) => sum + arr.length, 0)
                : daftarSiswaPerKelas[ (currentUser.role === 'admin' ? kelasDipilihAdmin : currentUser.kelas) ]?.length || 0;

            yAxisMax = maxHariAktifBulanan * jumlahSiswa;

            chartDatasets = [
                { label: 'Hadir', data: chartLabels.map(m => rekapPerBulan[m].Hadir), backgroundColor: '#2ECC71' },
                { label: 'Sakit', data: chartLabels.map(m => rekapPerBulan[m].Sakit), backgroundColor: '#F1C40F' },
                { label: 'Izin', data: chartLabels.map(m => rekapPerBulan[m].Izin), backgroundColor: '#3498DB' },
                { label: 'Alpha', data: chartLabels.map(m => rekapPerBulan[m].Alpha), backgroundColor: '#E74C3C' },
            ];
        }

        document.getElementById('grafikTitle').textContent = title;
        
        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: chartDatasets
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { 
                    y: { 
                        beginAtZero: true, 
                        ticks: { stepSize: 10 },
                        max: yAxisMax 
                    } 
                },
                plugins: { legend: { display: true } }
            }
        });
    }


    // --- FUNGSI-FUNGSI PENDUKUNG ---

    function exportPdf(title, tableId) {
    const doc = new jsPDF();
    const namaSekolah = "SDIT Nurul Hikmah";

    // Hitung Tahun Pelajaran otomatis
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth() + 1; // Januari = 1
    let tahunPelajaran;
    if (month >= 7) {
        tahunPelajaran = `${year}-${year + 1}`;
    } else {
        tahunPelajaran = `${year - 1}-${year}`;
    }

    // Format tanggal (dd-mm-yyyy) untuk nama file
    const todayDate = `${String(now.getDate()).padStart(2, '0')}-${String(month).padStart(2, '0')}-${year}`;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(14);
    doc.text(title, 14, 16);
    doc.setFontSize(10);
    doc.text(`${namaSekolah} - Tahun Pelajaran ${tahunPelajaran}`, 14, 22);
    
    doc.autoTable({
        html: '#' + tableId,
        startY: 28,
        styles: { fontSize: 8, cellPadding: 1.5 },
        headStyles: { fillColor: [22, 160, 133], textColor: 255, fontSize: 9 },
        didDrawPage: function (data) {
            const pageCount = doc.internal.getNumberOfPages();
            const pageWidth = doc.internal.pageSize.width;
            doc.setFontSize(8);
            doc.setTextColor(150);
            doc.text(
                `© ${year} umamproject absensi - Halaman ${data.pageNumber} dari ${pageCount}`,
                pageWidth / 2,
                doc.internal.pageSize.height - 10,
                { align: 'center' }
            );
        }
    });
    
    let finalY = doc.lastAutoTable.finalY || 50;
    const pageHeight = doc.internal.pageSize.height;
    const pageWidth = doc.internal.pageSize.getWidth();

    if (finalY > pageHeight - 70) {
        doc.addPage();
        finalY = 20;
    }
    
    const today = new Date().toLocaleDateString('id-ID', { 
        day: 'numeric', month: 'long', year: 'numeric' 
    });
    const kelasYangDipilih = (currentUser.role === 'admin') 
        ? document.getElementById('kelasFilter').value 
        : currentUser.kelas;
    const namaGuru = users[currentUser.username]?.nama || schoolStaff.guruKelas[kelasYangDipilih];
    const namaKepsek = schoolStaff.kepalaSekolah;

    doc.setFontSize(10);
    // Mengetahui di kiri, Jakarta di kanan (sebaris)
    doc.text("Mengetahui,", 20, finalY + 20);
    doc.text(`Jakarta, ${today}`, pageWidth - 20, finalY + 20, { align: "right" });

    // Tanda tangan
    doc.text(`Kepala Sekolah ${namaSekolah}`, 20, finalY + 35);
    doc.text(`Guru Kelas ${kelasYangDipilih}`, pageWidth - 20, finalY + 35, { align: "right" });

    doc.text(namaKepsek, 20, finalY + 45);
    doc.text(namaGuru, pageWidth - 20, finalY + 45, { align: "right" });
    
    // Simpan file
    const fileName = `${title.replace(/\s/g, '_')}_${tahunPelajaran}_${todayDate}.pdf`;
    doc.save(fileName);
}

    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth() + 1; // Januari = 1
    let tahunPelajaran;
    if (month >= 7) {
        tahunPelajaran = `${year}-${year + 1}`;
    } else {
        tahunPelajaran = `${year - 1}-${year}`;
    }

    // Format tanggal (dd-mm-yyyy) untuk nama file
    const todayDate = `${String(now.getDate()).padStart(2, '0')}-${String(month).padStart(2, '0')}-${year}`;

    });

        ? (document.getElementById('grafikKelasFilter')?.value || 'Semua Kelas')

        ? (users[currentUser.username]?.nama || schoolStaff.guruKelas[kelasYangDipilih])

    doc.setFontSize(10);

    doc.text(`Kepala Sekolah ${namaSekolah}`, 20, baseY + 15);

    if (kelasYangDipilih !== 'semua') {
        doc.text(`Guru Kelas ${kelasYangDipilih}`, pageWidth - 20, baseY + 15, { align: "right" });
    }

    doc.text(namaKepsek, 20, baseY + 25);
    if (kelasYangDipilih !== 'semua') {

    }

    function populateKelasFilter() {
        const kelasSet = [...new Set(Object.values(users).filter(u => u.kelas).map(u => u.kelas))].sort();
        const kelasFilter = document.getElementById('kelasFilter');
        kelasFilter.innerHTML = '';
        kelasSet.forEach(kelas => {
            const option = document.createElement('option');
            option.value = kelas;
            option.textContent = kelas;
            kelasFilter.appendChild(option);
        });
        
        kelasFilter.addEventListener('change', () => {
             const activeReportTitleEl = document.querySelector('#contentArea h2');
             if (!activeReportTitleEl) return;
             const activeReportTitle = activeReportTitleEl.textContent;
             if (activeReportTitle.includes('Harian')) showLaporanHarian();
             else if (activeReportTitle.includes('Rekap')) generateRekapTable();
             else if (activeReportTitle.includes('Form Absensi')) showFormAbsensi();
             else if (activeReportTitle.includes('Grafik')) generateGrafik();
        });
    }

    function updateDateTime() {
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('currentTime').textContent = now.toLocaleTimeString('id-ID');
    }

    // --- LOGIKA LOGIN, LOGOUT, & INISIALISASI ---

    function initApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContainer').classList.remove('hidden');
        
        document.getElementById('userWelcome').textContent = `Selamat datang, ${currentUser.nama}`;
        
        if (currentUser.role === 'admin') {
            document.getElementById('userRole').textContent = 'Administrator';
            document.getElementById('userAvatar').textContent = '👑';
            document.getElementById('adminControls').classList.remove('hidden');
            populateKelasFilter();
        } else {
            document.getElementById('userRole').textContent = `Guru Kelas ${currentUser.kelas}`;
            document.getElementById('userAvatar').textContent = '👩‍🏫';
            document.getElementById('adminControls').classList.add('hidden');
        }
        
        showFormAbsensi();
    }

    function logout() {
        sessionStorage.removeItem('currentUser');
        location.reload();
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const username = document.getElementById('username').value.toLowerCase().trim();
        const password = document.getElementById('password').value;
        const user = users[username];

        if (user && user.password === password) {
            currentUser = { username, ...user };
            sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
            initApp();
        } else {
            document.getElementById('loginError').classList.remove('hidden');
        }
    });
    
    function generateInitialData() {
        const today = new Date().toISOString().slice(0, 10);
        for (const kelas in daftarSiswaPerKelas) {
            daftarSiswaPerKelas[kelas].forEach(nama => {
                const exists = absensiData.some(d => d.tanggal === today && d.nama === nama);
                if (!exists) {
                    absensiData.push({
                        tanggal: today,
                        nama: nama,
                        kelas: kelas,
                        status: "Hadir",
                        keterangan: ""
                    });
                }
            });
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        generateInitialData();
        const savedUser = sessionStorage.getItem('currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            initApp();
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
    });

</script>
